<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Baicheng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: left-aligned single column; label rail on the left of each section, content on the right. Blue→red gradient is the one bold element. */
:root{
  --tum:#0065BD; --pku:#94070A; --mix:#4A3664;
  --bg:#F7F7FA; --surface:#FFFFFF; --fg:#16141C; --muted:#5E5A6B; --line:#E2E0EA; --soft:#ECEAF3;
  --display:"Bricolage Grotesque","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --body:"IBM Plex Sans","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --tum:#5EA2E8; --pku:#E2646C; --mix:#B3A2E0;
  --bg:#121118; --surface:#1B1A23; --fg:#ECEAF2; --muted:#A19DB0; --line:#2C2A37; --soft:#221F2E; color-scheme:dark}}
:root[data-theme="dark"]{
  --tum:#5EA2E8; --pku:#E2646C; --mix:#B3A2E0;
  --bg:#121118; --surface:#1B1A23; --fg:#ECEAF2; --muted:#A19DB0; --line:#2C2A37; --soft:#221F2E; color-scheme:dark}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--fg);font:16px/1.7 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:2px solid var(--mix);outline-offset:3px;border-radius:4px}

/* top band */
.band{height:6px;background:linear-gradient(90deg,var(--tum),var(--mix) 50%,var(--pku))}
nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:22px}
.mark{font:700 17px/1 var(--display);letter-spacing:-.01em;text-decoration:none}
.mark span{color:var(--mix)}
.navr{display:flex;align-items:center;gap:22px}
.navr a{font-size:14px;color:var(--muted);text-decoration:none}
.navr a:hover{color:var(--fg)}
.lang{display:flex;gap:2px;padding:3px;background:var(--soft);border-radius:8px}
.lang button{font:500 12px/1 var(--mono);letter-spacing:.04em;border:0;background:none;color:var(--muted);padding:6px 9px;border-radius:6px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* hero */
header{padding-block:64px 56px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(44px,9vw,92px)/1 var(--display);letter-spacing:-.035em;margin-block:18px 22px;text-wrap:balance}
h1 .grad{background:linear-gradient(90deg,var(--tum),var(--mix) 55%,var(--pku));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(17px,2.2vw,20px);color:var(--muted);max-width:34em}
.clocks{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
.clock{display:flex;align-items:baseline;gap:12px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.clock .city{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.clock .t{font:500 20px/1 var(--mono);font-variant-numeric:tabular-nums}
.clock .dot{width:8px;height:8px;border-radius:50%;align-self:center}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:9px;font-weight:500;font-size:15px;text-decoration:none;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--mix);color:var(--bg)}
.btn.ghost{border:1px solid var(--line);background:var(--surface)}

/* sections */
section{display:grid;grid-template-columns:180px 1fr;gap:32px;padding-block:56px;border-top:1px solid var(--line)}
section>h2{font:500 12px/1.6 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:6px}
section>div{min-width:0}
.about p{font-size:18px;max-width:36em}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.tag{font-size:13px;padding:5px 12px;border-radius:999px;background:var(--soft);color:var(--fg)}

.work{list-style:none;display:grid}
.work li{display:grid;grid-template-columns:1fr auto;gap:4px 24px;padding-block:22px;border-bottom:1px solid var(--line);position:relative}
.work li:first-child{padding-top:0}
.work li:last-child{border-bottom:0;padding-bottom:0}
.work h3{font:700 22px/1.25 var(--display);letter-spacing:-.015em}
.work p{color:var(--muted);grid-column:1}
.work .meta{grid-row:1/3;grid-column:2;text-align:right;font:400 13px/1.6 var(--mono);color:var(--muted);white-space:nowrap}
.work .kind{display:block;color:var(--mix);font-weight:500}
.work li::before{content:"";position:absolute;left:-16px;top:28px;width:3px;height:0;background:linear-gradient(var(--tum),var(--pku));transition:height .2s}
.work li:first-child::before{top:6px}
.work li:hover::before{height:22px}

.contact .mail{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:6px}
.contact code{font:500 clamp(18px,3vw,26px)/1.3 var(--mono);user-select:all;word-break:break-all}
.copy{font:500 13px/1 var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 12px;border-radius:8px;cursor:pointer}
.contact .links{display:flex;gap:20px;margin-top:20px;font-size:15px}
.contact .links a{color:var(--mix);text-underline-offset:3px}

footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding-block:28px 40px;border-top:1px solid var(--line);font:400 12px/1.6 var(--mono);color:var(--muted)}

@media (max-width:680px){
  section{grid-template-columns:1fr;gap:18px;padding-block:44px}
  .navr a{display:none}
  .work li{grid-template-columns:1fr}
  .work .meta{grid-row:auto;grid-column:1;text-align:left}
  .work li::before{display:none}
}
</style>
</head>
<body>
<div class="band"></div>
<div class="wrap">
  <nav>
    <a class="mark" href="#">baicheng<span>.</span></a>
    <div class="navr">
      <a href="#about" data-i="nav_about"></a>
      <a href="#work" data-i="nav_work"></a>
      <a href="#contact" data-i="nav_contact"></a>
      <div class="lang" role="group" aria-label="Language">
        <button id="l-zh" data-l="zh">中</button><button id="l-en" data-l="en">EN</button><button id="l-de" data-l="de">DE</button>
      </div>
    </div>
  </nav>

  <header>
    <p class="eyebrow" data-i="eyebrow"></p>
    <h1><span data-i="hi"></span> <span class="grad">Baicheng</span></h1>
    <p class="lead" data-i="lead"></p>
    <div class="clocks">
      <div class="clock"><span class="dot" style="background:var(--tum)"></span><span class="city" data-i="c_de"></span><span class="t" id="t-de">--:--</span></div>
      <div class="clock"><span class="dot" style="background:var(--pku)"></span><span class="city" data-i="c_cn"></span><span class="t" id="t-cn">--:--</span></div>
    </div>
    <div class="cta">
      <a class="btn primary" href="#work" data-i="see_work"></a>
      <a class="btn ghost" href="#contact" data-i="contact_me"></a>
    </div>
  </header>

  <section id="about" class="about">
    <h2 data-i="nav_about"></h2>
    <div>
      <p data-i="about"></p>
      <div class="tags" id="tags"></div>
    </div>
  </section>

  <section id="work">
    <h2 data-i="nav_work"></h2>
    <div><ul class="work" id="work-list"></ul></div>
  </section>

  <section id="contact" class="contact">
    <h2 data-i="nav_contact"></h2>
    <div>
      <p data-i="contact_txt"></p>
      <div class="mail"><code id="mail">hello@example.com</code><button class="copy" id="copy" data-i="copy"></button></div>
      <div class="links"><a href="https://github.com/eiinde">GitHub ↗</a></div>
    </div>
  </section>

  <footer><span>© <span id="y"></span> Baicheng</span><span data-i="made"></span></footer>
</div>

<script>
const T={
 zh:{nav_about:"关于",nav_work:"教育经历",nav_contact:"联系",eyebrow:"个人主页 · 德国",hi:"你好，我是",
  lead:"在德国生活和学习。这里收集我做过的项目、拍过的照片，以及正在思考的事情。",
  c_de:"德国",c_cn:"北京",see_work:"教育经历",contact_me:"联系我",
  about:"在这里写一段自我介绍：你是谁、在做什么、关心什么。可以写专业背景、正在学的东西，或者让你开心的爱好。",
  tags:["网页设计","编程","摄影","旅行"],contact_txt:"有合作想法，或者只是想打个招呼，都欢迎来信。",copy:"复制",copied:"已复制",
  made:"用 GitHub Pages 搭建",
  works:[["大学名称","专业名称 · 在这里写研究方向或主要课程。","硕士","2024 – 至今"],["大学名称","专业名称 · 在这里写毕业论文题目或主要成绩。","本科","2020 – 2024"],["高中名称","所在城市。","高中","2017 – 2020"]]},
 en:{nav_about:"About",nav_work:"Education",nav_contact:"Contact",eyebrow:"Personal site · Germany",hi:"Hi, I'm",
  lead:"Living and studying in Germany. A collection of projects I've built, photos I've taken and things I'm thinking about.",
  c_de:"Germany",c_cn:"Beijing",see_work:"Education",contact_me:"Get in touch",
  about:"Write a short introduction here: who you are, what you're working on and what you care about. Your background, what you're learning, or the hobbies that make you happy.",
  tags:["Web design","Coding","Photography","Travel"],contact_txt:"Have an idea to work on together, or just want to say hello? Write to me.",copy:"Copy",copied:"Copied",
  made:"Built with GitHub Pages",
  works:[["University name","Program name · Research focus or key courses.","M.Sc.","2024 – now"],["University name","Program name · Thesis topic or highlights.","B.Sc.","2020 – 2024"],["High school name","City.","School","2017 – 2020"]]},
 de:{nav_about:"Über mich",nav_work:"Ausbildung",nav_contact:"Kontakt",eyebrow:"Persönliche Seite · Deutschland",hi:"Hallo, ich bin",
  lead:"Ich lebe und lerne in Deutschland. Hier sammle ich meine Projekte, Fotos und Gedanken.",
  c_de:"Deutschland",c_cn:"Peking",see_work:"Ausbildung",contact_me:"Kontakt",
  about:"Schreib hier eine kurze Vorstellung: wer du bist, woran du arbeitest und was dir wichtig ist. Dein Hintergrund, was du gerade lernst oder deine Hobbys.",
  tags:["Webdesign","Programmieren","Fotografie","Reisen"],contact_txt:"Eine Idee für ein gemeinsames Projekt oder einfach ein Hallo? Schreib mir.",copy:"Kopieren",copied:"Kopiert",
  made:"Erstellt mit GitHub Pages",
  works:[["Name der Universität","Studiengang · Schwerpunkt oder wichtige Kurse.","M.Sc.","2024 – heute"],["Name der Universität","Studiengang · Thema der Abschlussarbeit oder Highlights.","B.Sc.","2020 – 2024"],["Name der Schule","Stadt.","Schule","2017 – 2020"]]}
};
let cur="zh";
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function setLang(l){
  cur=l;const t=T[l];document.documentElement.lang=l==="zh"?"zh-CN":l;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t[e.dataset.i]);
  document.getElementById("tags").innerHTML=t.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join("");
  document.getElementById("work-list").innerHTML=t.works.map(w=>`<li><h3>${esc(w[0])}</h3><p>${esc(w[1])}</p><div class="meta"><span class="kind">${esc(w[2])}</span>${w[3]}</div></li>`).join("");
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  try{localStorage.setItem("lang",l)}catch(e){}
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));
function tick(){
  const f=tz=>new Intl.DateTimeFormat("de-DE",{hour:"2-digit",minute:"2-digit",timeZone:tz}).format(new Date());
  document.getElementById("t-de").textContent=f("Europe/Berlin");
  document.getElementById("t-cn").textContent=f("Asia/Shanghai");
}
tick();setInterval(tick,15000);
document.getElementById("copy").addEventListener("click",e=>{
  const btn=e.currentTarget,txt=document.getElementById("mail").textContent;
  const done=()=>{btn.textContent=T[cur].copied;setTimeout(()=>btn.textContent=T[cur].copy,1600)};
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(done,()=>{getSelection().selectAllChildren(document.getElementById("mail"))});
  else getSelection().selectAllChildren(document.getElementById("mail"));
});
document.getElementById("y").textContent=new Date().getFullYear();
let saved;try{saved=localStorage.getItem("lang")}catch(e){}
const nl=(navigator.language||"").slice(0,2);
setLang(saved&&T[saved]?saved:(T[nl]?nl:"zh"));
</script>
</body>
</html>
